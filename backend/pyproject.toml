[project]
name = "webintel-ai-backend"
version = "0.1.0"
description = "Backend services for the WebIntel AI distributed web intelligence platform."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "aiokafka>=0.10.0",
    "asyncpg>=0.29.0",
    "celery[redis]>=5.4.0",
    "fastapi>=0.111.0",
    "greenlet>=3.0.3",
    "httpx>=0.27.0",
    "email-validator>=2.1.0",
    "elasticsearch[async]>=8.14.0",
    "minio>=7.2.7",
    "neo4j>=5.22.0",
    "prometheus-client>=0.20.0",
    "playwright>=1.45.0",
    "pydantic-settings>=2.3.4",
    "beautifulsoup4>=4.12.3",
    "openai>=1.40.0",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.9.0",
    "redbeat>=2.2.0; python_version < '3.14'",
    "Scrapy>=2.11.2",
    "SQLAlchemy>=2.0.31",
    "strawberry-graphql[fastapi]>=0.237.0",
    "structlog>=24.2.0",
    "uvicorn[standard]>=0.30.1",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[project.optional-dependencies]
ml = [
    "spacy>=3.7.5",
    "stable-baselines3>=2.3.2",
    "torch>=2.3.1",
    "transformers>=4.43.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
