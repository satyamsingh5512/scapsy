app = "webintel-ai"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"
  context = "backend"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  API_V1_PREFIX = "/api/v1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
