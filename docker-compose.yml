name: webintel-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: webintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webintel
      POSTGRES_USER: webintel
      POSTGRES_PASSWORD: webintel_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webintel -d webintel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webintel

  redis:
    image: redis:7-alpine
    container_name: webintel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webintel

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: webintel-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - webintel

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: webintel-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - webintel

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: webintel-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: webintel-cluster
      node.name: webintel-es01
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - webintel

  neo4j:
    image: neo4j:5.22
    container_name: webintel-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/webintel_dev_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - webintel

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: webintel-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: webintel
      MINIO_ROOT_PASSWORD: webintel_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - webintel

  ollama:
    image: ollama/ollama:0.2.7
    container_name: webintel-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - webintel

  backend-api:
    build:
      context: ./backend
    container_name: webintel-backend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      APP_ENV: docker
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://webintel:webintel_dev_password@postgres:5432/webintel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDBEAT_REDIS_URL: redis://redis:6379/3
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: webintel_dev_password
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: webintel
      MINIO_SECRET_KEY: webintel_dev_password
      OLLAMA_BASE_URL: http://ollama:11434
      BOOTSTRAP_ADMIN_EMAIL: admin@webintel.local
      BOOTSTRAP_ADMIN_PASSWORD: change_me
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    networks:
      - webintel

  celery-worker:
    build:
      context: ./backend
    container_name: webintel-celery-worker
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_started
    command: ["celery", "-A", "app.pipeline.scheduler.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://webintel:webintel_dev_password@postgres:5432/webintel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDBEAT_REDIS_URL: redis://redis:6379/3
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: webintel_dev_password
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: webintel
      MINIO_SECRET_KEY: webintel_dev_password
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      - webintel

  extraction-worker:
    build:
      context: ./backend
    container_name: webintel-extraction-worker
    restart: unless-stopped
    depends_on:
      celery-worker:
        condition: service_started
    command: ["python", "-m", "app.pipeline.extraction_worker"]
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://webintel:webintel_dev_password@postgres:5432/webintel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDBEAT_REDIS_URL: redis://redis:6379/3
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: webintel_dev_password
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: webintel
      MINIO_SECRET_KEY: webintel_dev_password
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      - webintel

  storage-worker:
    build:
      context: ./backend
    container_name: webintel-storage-worker
    restart: unless-stopped
    depends_on:
      extraction-worker:
        condition: service_started
    command: ["python", "-m", "app.pipeline.storage_worker"]
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://webintel:webintel_dev_password@postgres:5432/webintel
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: webintel_dev_password
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: webintel
      MINIO_SECRET_KEY: webintel_dev_password
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      - webintel

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  neo4j_data:
  minio_data:
  ollama_data:

networks:
  webintel:
    driver: bridge
